[project]
name = "vantage-mcp"
version = "0.1.0"
description = "Vantage MCP server scaffold: stdio control-plane exposing DWARF and edge-bridge tools to AI assistants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
vantage-mcp = "vantage_mcp.server:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage_mcp"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["vantage_mcp"]
strict = true
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
